<html lang="en">
    <head>
        <title>The Treasure of Mount Wind</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous" />
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>THE TREASURE OF MOUNT WIND</h1>
            <nav>
                <a href="./index.html">Home page</a>
                <a href="./login.html">Login page</a>
                <a href="./connect.html">Connection page</a>
                <a href="./play.html">Play page</a>
            </nav>
        </header>
        <main class="login-page">
            <section class="credentials">
                <h2>LOGIN</h2>
                <div>
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        placeholder="your@email.com">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        placeholder="password">
                </div>
                <a href="./connect.html"
                    class="btn btn-primary maroon-button align-self-center mt-3">
                    Login
                </a>
            </section>
            <section class="credentials">
                <h2>REGISTER</h2>
                <div>
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        placeholder="your@email.com">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        placeholder="password">
                    <label class="form-label">Confirm Password</label>
                    <input
                        type="password"
                        class="form-control"
                        placeholder="confirm password">
                </div>
                <a href="./connect.html"
                    class="btn btn-primary maroon-button align-self-center mt-3">
                    Register
                </a>
            </section>
        </main>
        <footer>
            <div>
                <p>This was made by David Bassett</p>
                <a href="https://github.com/blazzer5555/Startup"
                    class="github-link">link to my github</a>
            </div>
        </footer>
    </body>
</html>
